[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "retro_synth"
version = "0.1.0"
description = "A cross-platform Python desktop workstation for composing and previewing retro game music in real time."
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "PySide6>=6.5.0",
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "sounddevice>=0.4.6",
    "soundfile>=0.12.1",
    "mido>=1.3.0",
    "python-rtmidi>=1.5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.3.0",
    "pytest-qt>=4.2.0",
    "hypothesis>=6.75.0",
    "pyinstaller>=5.10.0",
]

[project.scripts]
retro-synth = "retro_synth.app:main"
